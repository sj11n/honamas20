name: Deploy to staging

# Deploys theme and plugin together to staging.honamas.com.
# - Automatically on every push to main that touches theme or plugin.
# - Manually for any branch: Actions > Deploy to staging > Run workflow.
# Uses plain SFTP (lftp), so a Strato SFTP-only user restricted to the staging folder is enough.
# Media, database and wp-config are never touched.
# Rollback: re-run this workflow on the previous commit/branch.

on:
  push:
    branches: [main]
    paths:
      - "wp-content/themes/honamas/**"
      - "wp-content/plugins/honamas-core/**"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy HONAMAS theme and plugin
    runs-on: ubuntu-latest
    environment: staging
    env:
      LFTP_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SFTP
        run: |
          sudo apt-get install -y -qq lftp
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.STAGING_HOST }}" >> ~/.ssh/known_hosts

      - name: Resolve target paths
        run: |
          THEME_PATH="${{ secrets.STAGING_THEME_PATH }}"
          THEME_PATH="${THEME_PATH%/}"
          case "$THEME_PATH" in
            */wp-content/themes/honamas) ;;
            *) echo "STAGING_THEME_PATH must end with /wp-content/themes/honamas, got: $THEME_PATH"; exit 1 ;;
          esac
          echo "THEME_PATH=$THEME_PATH" >> "$GITHUB_ENV"
          echo "PLUGIN_PATH=${THEME_PATH%/themes/honamas}/plugins/honamas-core" >> "$GITHUB_ENV"

      - name: Deploy theme and plugin
        run: |
          lftp -u "${{ secrets.STAGING_USER }}" "sftp://${{ secrets.STAGING_HOST }}" <<EOF
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes"
          set net:max-retries 3
          set net:timeout 30
          mirror -R --delete --parallel=3 --verbose wp-content/themes/honamas "$THEME_PATH"
          mirror -R --delete --parallel=3 --verbose wp-content/plugins/honamas-core "$PLUGIN_PATH"
          bye
          EOF

      - name: Smoke test
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" http://staging.honamas.com/)
          echo "Front page: $code"
          test "$code" = "200"
          if curl -s http://staging.honamas.com/robots.txt | grep -q "Disallow: /$"; then
            echo "robots.txt blocks indexing"
          else
            echo "::warning::staging robots.txt does not block indexing"
          fi

      - name: Summary
        run: |
          echo "Deployed $GITHUB_SHA (ref $GITHUB_REF_NAME) to staging: theme + plugin." >> "$GITHUB_STEP_SUMMARY"
