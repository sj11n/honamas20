name: Deploy theme to staging

on:
  workflow_dispatch:

jobs:
  deploy-theme:
    name: Deploy HONAMAS theme
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s" "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -H "${{ secrets.STAGING_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy theme files
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/staging_key -o StrictHostKeyChecking=yes" \
            wp-content/themes/honamas/ \
            "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:${{ secrets.STAGING_THEME_PATH }}/"

      - name: Post-deploy note
        run: echo "Theme deployed to staging. WordPress uploads and environment-specific config were not touched."
